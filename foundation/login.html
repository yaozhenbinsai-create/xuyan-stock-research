<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 序研</title>
  <style>
    :root{font:16px/1.55 system-ui,"Microsoft YaHei",sans-serif;color:#18213a;background:#f6f7f9}
    body{margin:0;min-height:100vh;display:grid;place-items:center}
    main{background:white;padding:2rem;width:min(22rem,calc(100vw - 5rem));border:1px solid #d9dee7;border-radius:12px}
    h1{font-size:1.45rem;margin:0 0 1.4rem}label{display:block;margin-top:1rem}
    input,button{box-sizing:border-box;width:100%;font:inherit;padding:.55rem .7rem;border-radius:5px}
    input{border:1px solid #9aa3b4}button{margin-top:1.4rem;background:#20345d;color:white;border:0;cursor:pointer}
    [role=alert]{color:#962f30}
  </style>
</head>
<body>
  <main>
    <h1>登录序研工作台</h1>
    <!-- status -->
    <form method="post" action="/login">
      <label for="user">账号</label>
      <input id="user" name="username" value="ADMIN" autocomplete="username" required>
      <label for="password">密码</label>
      <input id="password" type="password" name="password" autocomplete="current-password" maxlength="160" required>
      <button type="submit">登录</button>
    </form>
  </main>
</body>
</html>
